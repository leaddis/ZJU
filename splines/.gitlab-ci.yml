# This file is a template, and might need editing before it works on your project.
# To contribute improvements to CI/CD templates, please follow the Development guide at:
# https://docs.gitlab.com/ee/development/cicd/templates.html
# This specific template is located at:
# https://gitlab.com/gitlab-org/gitlab/-/blob/master/lib/gitlab/ci/templates/Getting-Started.gitlab-ci.yml

# This is a sample GitLab CI/CD configuration file that should run without any modifications.
# It demonstrates a basic 3 stage CI/CD pipeline. Instead of real tests or scripts,
# it uses echo commands to simulate the pipeline execution.
#
# A pipeline is composed of independent jobs that run scripts, grouped into stages.
# Stages run in sequential order, but jobs within stages run in parallel.
#
# For more information, see: https://docs.gitlab.com/ee/ci/yaml/index.html#stages

variables:
  BALTAM_CORE_VERSION: "3.2.0"
  GIT_SUBMODULE_STRATEGY: recursive
  PACKAGE_VERSION: $CI_COMMIT_TAG
  PACKAGE_REGISTRY_URL: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/splines/${PACKAGE_VERSION}"

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "master"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

stages:          # List of stages for jobs, and their order of execution
  - build
  - upload
  - deploy

build-ubuntu20.04:       # This job runs in the build stage, which runs first.
  stage: build
  image: runner/builtin:ubuntu20.04
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
    - if: $CI_COMMIT_BRANCH == 'master'
    - if: $CI_COMMIT_TAG
    - when: manual
  script:
    - scripts/build.sh ubuntu20.04
  artifacts:
    expire_in: 1 day
    paths:
      - build/*.zip
  tags:
    - linux

build-ubuntu22.04:       # This job runs in the build stage, which runs first.
  stage: build
  image: runner/builtin:ubuntu22.04
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
    - if: $CI_COMMIT_BRANCH == 'master'
    - if: $CI_COMMIT_TAG
    - when: manual
  script:
    - scripts/build.sh ubuntu22.04
  artifacts:
    expire_in: 1 day
    paths:
      - build/*.zip
  tags:
    - linux

build-debian10:       # This job runs in the build stage, which runs first.
  stage: build
  image: runner/builtin:debian10
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
    - if: $CI_COMMIT_BRANCH == 'master'
    - if: $CI_COMMIT_TAG
    - when: manual
  script:
    - scripts/build.sh debian10
  artifacts:
    expire_in: 1 day
    paths:
      - build/*.zip
  tags:
    - linux

build-generic:
  stage: build
  image: baltam_generic:v1
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
    - if: $CI_COMMIT_BRANCH == 'master'
    - if: $CI_COMMIT_TAG
    - when: manual
  script:
    - scripts/build.sh ubuntu16.04
  artifacts:
    expire_in: 1 day
    paths:
      - build/*.zip
  tags:
    - linux

build-windows:
  stage: build
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
    - if: $CI_COMMIT_BRANCH == 'master'
    - if: $CI_COMMIT_TAG
    - when: manual
  script:
    - scripts/build.ps1
  artifacts:
    expire_in: 1 day
    paths:
      - build/*.zip
  tags: 
    - win

upload:
  stage: upload
  image: curlimages/curl:latest
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - ls build/
    - |
      find build -name "*.zip" -exec curl --header "JOB-TOKEN: ${CI_JOB_TOKEN}" -T {} "${PACKAGE_REGISTRY_URL}/" \;
  tags:
    - linux


deploy-job:      # This job runs in the deploy stage.
  stage: deploy  # It only runs when *both* jobs in the test stage complete successfully.
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - | 
      release-cli create --name $PACKAGE_VERSION --tag-name $PACKAGE_VERSION --description "release_notes/${PACKAGE_VERSION}.md"
  tags: 
    - linux
